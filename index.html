<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ghost Chat v2.0</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

<h1>👻 GHOST CHAT</h1>

<div class="card">

<h3>Your Chat ID</h3>

<div class="id-box">
<span id="my-id">Generating...</span>
<button id="copy-btn">COPY</button>
</div>

<p class="hint">
Share this ID with your friend to connect.
</p>

</div>


<div class="card">

<h3>Connect Friend</h3>

<div class="row">

<input 
type="text" 
id="friend-id"
placeholder="Enter Friend ID">

<button id="connect-btn">
CONNECT
</button>

</div>

<p id="status">
Status: Offline
</p>

</div>



<div id="chat-box">

<div class="system">
System ready...
</div>

</div>



<div class="row message-area">

<input 
type="text"
id="message"
placeholder="Type message...">

<button id="send-btn">
SEND
</button>

</div>


</div>

<script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
<script src="app.js"></script>

</body>
</html>
